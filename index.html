<style>
  html, body { background: #0B1220; margin: 0; padding: 0; height: 100%; color: #E6EDF3; }
  #root { min-height: 100vh; }
  .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  .neon-glow { box-shadow: 0 0 12px rgba(46,157,244,0.55), 0 0 2px rgba(46,157,244,0.85); }
  .neon-text { text-shadow: 0 0 8px rgba(46,157,244,0.6); }
  @keyframes scan {
    0% { transform: translateY(-100%); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(220%); opacity: 0; }
  }
  .scan-line { animation: scan 1.8s linear infinite; }
</style>

<div id="root">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8CA3C7;font-family:sans-serif;font-size:14px;">
    Loading Docly…
  </div>
</div>
<div id="error-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#FF5C5C;color:#fff;padding:12px;font-family:monospace;font-size:12px;z-index:9999;white-space:pre-wrap;"></div>
<script>
  function showError(msg) {
    var el = document.getElementById("error-banner");
    el.style.display = "block";
    el.textContent = "Docly failed to load:\n" + msg;
  }
  window.addEventListener("error", function (e) {
    showError(e.message + " (" + (e.filename || "") + ":" + (e.lineno || "") + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    showError("Promise error: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>

<script src="app.js" defer></script>
