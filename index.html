  const matches = binaryStr.match(/\/Type\s*\/Page(?!s)/g);

function Docly() {
  const [session, setSession] = useState(null);
  const [authEmail, setAuthEmail] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authMode, setAuthMode] = useState("signin");
  const [authLoading, setAuthLoading] = useState(false);
  const [authError, setAuthError] = useState(null);
  const [authNotice, setAuthNotice] = useState(null);
  const [ready, setReady] = useState(false);

  const [file, setFile] = useState(null);
  const [base64Data, setBase64Data] = useState(null);
  const [pageEstimate, setPageEstimate] = useState(null);
  const [messages, setMessages] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [chatInput, setChatInput] = useState("");
  const [isPro, setIsPro] = useState(false);
  const [usage, setUsage] = useState({ date: todayStr(), count: 0 });
  const [showDowngradeConfirm, setShowDowngradeConfirm] = useState(false);
  const [updates, setUpdates] = useState([]);
  const [showUpdates, setShowUpdates] = useState(false);
  const [hasUnseenUpdate, setHasUnseenUpdate] = useState(false);
  const fileInputRef = useRef(null);
  const scrollRef = useRef(null);

  function authHeaders(token) {
    return {
      "Content-Type": "application/json",
      apikey: SUPABASE_ANON_KEY,
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    };
  }

  function metadataFromUser(user) {
    const meta = user?.user_metadata || {};
    const usageM = meta.usage && meta.usage.date === todayStr() ? meta.usage : { date: todayStr(), count: 0 };
    return { pro: !!meta.pro, usage: usageM, dayPassUntil: meta.dayPassUntil || null };
  }

  async function loadSessionUser(accessToken) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, { headers: authHeaders(accessToken) });
    if (!res.ok) throw new Error("Session invalid");
    const user = await res.json();
    const parsed = metadataFromUser(user);
    setIsPro(parsed.pro);
    setUsage(parsed.usage);
    setAdsWatched(parsed.ads);
    setDayPassUntil(parsed.dayPassUntil);
    setSession({ access_token: accessToken, user });
  }

  useEffect(() => {
    (async () => {
      try {
        if (window.location.hash.includes("access_token")) {
          const params = new URLSearchParams(window.location.hash.slice(1));
          const token = params.get("access_token");
          if (token) {
            localStorage.setItem("docly-session", JSON.stringify({ access_token: token }));
            await loadSessionUser(token);
            window.history.replaceState(null, "", window.location.pathname);
            setReady(true);
            return;
          }
        }
        const cached = localStorage.getItem("docly-session");
        if (cached) {
          const { access_token } = JSON.parse(cached);
          await loadSessionUser(access_token);
        }
      } catch (e) {
        localStorage.removeItem("docly-session");
      }
      setReady(true);
    })();
  }, []);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  async function persistMetadata(partial) {
    if (!session) return;
    const nextPro = partial.pro !== undefined ? partial.pro : isPro;
    const nextUsage = partial.usage !== undefined ? partial.usage : usage;
    const nextDayPass = partial.dayPassUntil !== undefined ? partial.dayPassUntil : dayPassUntil;
    try {
      await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: "PUT",
        headers: authHeaders(session.access_token),
        body: JSON.stringify({ data: { pro: nextPro, usage: nextUsage, dayPassUntil: nextDayPass } }),
      });
    } catch (e) {}
  }

  function buyDayPass() {
    setPayError(null);
    if (!window.PaystackPop) {
      setPayError("Payment isn't ready yet — check your connection and try again.");
      return;
    }
    const handler = window.PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: session.user.email,
      amount: DAYPASS_PRICE_PESEWAS,
      currency: "GHS",
      ref: "docly_daypass_" + Date.now(),
      callback: function (response) {
        setPayLoading(true);
        fetch("/api/verify-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference: response.reference }),
        })
          .then((r) => r.json())
          .then((data) => {
            setPayLoading(false);
            if (data.verified) {
              const until = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
              setDayPassUntil(until);
              persistMetadata({ dayPassUntil: until });
              setError((prev) => (prev === "LIMIT_REACHED" ? null : prev));
            } else {
              setPayError("Payment could not be verified. If you were charged, contact support.");
            }
          })
          .catch(() => {
            setPayLoading(false);
            setPayError("Couldn't confirm payment. If you were charged, contact support.");
          });
      },
      onClose: function () {},
    });
    handler.openIframe();
  }

  function signInWithGoogle() {
    const redirectTo = encodeURIComponent(window.location.href.split("#")[0]);
    window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${redirectTo}`;
  }

  async function handleAuth() {
    setAuthError(null); setAuthNotice(null);
    if (!authEmail.trim() || !authPassword.trim()) { setAuthError("Enter your email and a password."); return; }
    if (authPassword.length < 6) { setAuthError("Password must be at least 6 characters."); return; }
    setAuthLoading(true);
    try {
      if (authMode === "signup") {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, { method: "POST", headers: authHeaders(), body: JSON.stringify({ email: authEmail.trim(), password: authPassword }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error_description || "Sign up failed");
        if (data.access_token) {
          localStorage.setItem("docly-session", JSON.stringify({ access_token: data.access_token }));
          await loadSessionUser(data.access_token);
        } else {
          setAuthNotice("Account created — check your email to confirm it, then sign in.");
          setAuthMode("signin");
        }
      } else {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, { method: "POST", headers: authHeaders(), body: JSON.stringify({ email: authEmail.trim(), password: authPassword }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error_description || "Sign in failed");
        localStorage.setItem("docly-session", JSON.stringify({ access_token: data.access_token }));
        await loadSessionUser(data.access_token);
      }
    } catch (e) {
      setAuthError(e.message || "Something went wrong.");
    } finally {
      setAuthLoading(false);
    }
  }

  function signOut() {
    setSession(null); setIsPro(false);
    setUsage({ date: todayStr(), count: 0 });
    setAdsWatched({ date: todayStr(), count: 0 });
    resetDoc();
    localStorage.removeItem("docly-session");
  }

  async function persistUsage(next) { setUsage(next); await persistMetadata({ usage: next }); }

  async function loadUpdates() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/updates?select=id,message,created_at&order=created_at.desc&limit=20`, {
        headers: authHeaders(session?.access_token),
      });
      if (!res.ok) return;
      const data = await res.json();
      setUpdates(data);
      const lastSeen = localStorage.getItem("docly-updates-seen");
      if (data.length > 0 && data[0].id.toString() !== lastSeen) setHasUnseenUpdate(true);
    } catch (e) {}
  }

  useEffect(() => {
    if (session) loadUpdates();
  }, [session]);

  function openUpdates() {
    setShowUpdates(true);
    setHasUnseenUpdate(false);
    if (updates.length > 0) localStorage.setItem("docly-updates-seen", updates[0].id.toString());
  }

  const [payLoading, setPayLoading] = useState(false);
  const [payError, setPayError] = useState(null);
  const [dayPassUntil, setDayPassUntil] = useState(null);
  const [preAuthView, setPreAuthView] = useState("landing"); // 'landing' | 'auth'

  const dayPassActive = dayPassUntil && new Date(dayPassUntil) > new Date();
  const hasUnlimitedAccess = isPro || dayPassActive;

  async function togglePro() {
    if (isPro) {
      setShowDowngradeConfirm(true);
      return;
    }
    setPayError(null);
    if (!window.PaystackPop) {
      setPayError("Payment isn't ready yet — check your connection and try again.");
      return;
    }
    const handler = window.PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: session.user.email,
      plan: PAYSTACK_PLAN_CODE,
      amount: PRO_PRICE_PESEWAS,
      currency: "GHS",
      ref: "docly_" + Date.now(),
      callback: function (response) {
        setPayLoading(true);
        fetch("/api/verify-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference: response.reference }),
        })
          .then((r) => r.json())
          .then((data) => {
            setPayLoading(false);
            if (data.verified) {
              setIsPro(true);
              persistMetadata({ pro: true });
            } else {
              setPayError("Payment could not be verified. If you were charged, contact support.");
            }
          })
          .catch(() => {
            setPayLoading(false);
            setPayError("Couldn't confirm payment. If you were charged, contact support.");
          });
      },
      onClose: function () {},
    });
    handler.openIframe();
  }
  async function confirmDowngrade() {
    setIsPro(false); setShowDowngradeConfirm(false);
    await persistMetadata({ pro: false });
  }

  function resetDoc() {
    setFile(null); setBase64Data(null); setPageEstimate(null);
    setMessages([]); setError(null); setChatInput("");
    if (fileInputRef.current) fileInputRef.current.value = "";
  }

  function handleFile(f) {
    setError(null);
    if (!f) return;
    if (f.type !== "application/pdf") { setError("Docly reads PDFs only, for now."); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const b64 = dataUrl.split(",")[1];
      let pages = null;
      try { pages = estimatePageCount(atob(b64)); } catch (e) {}
      setFile(f); setBase64Data(b64); setPageEstimate(pages);
    };
    reader.onerror = () => setError("Couldn't read that file. Try again.");
    reader.readAsDataURL(f);
  }

  function onDrop(e) { e.preventDefault(); handleFile(e.dataTransfer.files?.[0]); }

  async function callBackend(contents) {
    const res = await fetch("/api/summarize", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    return data.text;
  }

  function toGeminiHistory(msgs) {
    return msgs.map((m) => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: m.parts,
    }));
  }

  async function startSummary() {
    setError(null);
    if (!hasUnlimitedAccess) {
      if (pageEstimate && pageEstimate > FREE_MAX_PAGES) {
        setError(`This document is about ${pageEstimate} pages. Free accounts summarize documents up to ${FREE_MAX_PAGES} pages. Upgrade to Pro for longer documents.`);
        return;
      }
      if (usage.count >= FREE_DOCS_PER_DAY) {
        setError("LIMIT_REACHED");
        return;
      }
    }

    setLoading(true);
    const parts = [
      { inlineData: { mimeType: "application/pdf", data: base64Data } },
      { text: "Summarize this document. Open with one sentence on what it is, then give the key points as short bullet items. Keep it tight and skimmable." },
    ];
    const userMsg = { role: "user", parts, display: `Uploaded: ${file.name}` };
    setMessages([userMsg]);

    try {
      const answer = await callBackend(toGeminiHistory([userMsg]));
      setMessages((prev) => [...prev, { role: "assistant", parts: [{ text: answer }], display: answer }]);
      if (!isPro && !dayPassActive) await persistUsage({ date: todayStr(), count: usage.count + 1 });
    } catch (e) {
      setError("Something went wrong generating the summary: " + (e.message || "unknown error"));
      setMessages([]);
    } finally {
      setLoading(false);
    }
  }

  async function sendQuestion() {
    const q = chatInput.trim();
    if (!q || loading) return;
    setChatInput(""); setError(null);
    const newUserMsg = { role: "user", parts: [{ text: q }], display: q };
    const updated = [...messages, newUserMsg];
    setMessages(updated);
    setLoading(true);
    try {
      const answer = await callBackend(toGeminiHistory(updated));
      setMessages((prev) => [...prev, { role: "assistant", parts: [{ text: answer }], display: answer }]);
    } catch (e) {
      setError("Couldn't get an answer that time. Try asking again.");
    } finally {
      setLoading(false);
    }
  }

  const docsLeftToday = hasUnlimitedAccess ? "Unlimited" : Math.max(0, FREE_DOCS_PER_DAY - usage.count);

  if (!ready) {
    return <div className="min-h-screen w-full bg-[#0B1220] flex items-center justify-center"><Icon.Loader className="w-6 h-6 text-[#2E9DF4]" /></div>;
  }

  if (!session) {
    if (preAuthView === "landing") {
      return (
        <div className="min-h-screen w-full bg-[#0B1220] text-[#E6EDF3] font-sans">
          <style>{`
            .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
            .neon-glow { box-shadow: 0 0 12px rgba(46,157,244,0.55), 0 0 2px rgba(46,157,244,0.85); }
            .neon-text { text-shadow: 0 0 8px rgba(46,157,244,0.6); }
          `}</style>

          <header className="max-w-4xl mx-auto px-5 py-5 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <DoclyLogo size={28} />
              <span className="mono font-semibold text-[15px] text-white">docly</span>
            </div>
            <button onClick={() => setPreAuthView("auth")} className="mono text-[12px] px-3 py-1.5 rounded border border-[#2E9DF4] text-[#2E9DF4] hover:bg-[#2E9DF4]/10 transition-colors">
              SIGN IN
            </button>
          </header>

          <main className="max-w-4xl mx-auto px-5 pt-10 pb-16 flex flex-col items-center text-center">
            <span className="mono text-[11px] text-[#2E9DF4] neon-text tracking-widest mb-3">DOCUMENT → GIST</span>
            <h1 className="text-4xl sm:text-5xl font-semibold tracking-tight mb-4 text-white max-w-2xl">Read the point, skip the pages.</h1>
            <p className="text-[#8CA3C7] mb-8 max-w-lg text-[15px]">Drop in any PDF — a textbook chapter, a contract, a research paper. Docly gives you a clean summary in seconds, then answers your questions about it.</p>
            <button onClick={() => setPreAuthView("auth")} className="mono text-sm bg-[#2E9DF4] neon-glow text-[#0B1220] rounded-lg px-8 py-3.5 font-semibold hover:opacity-90 transition-opacity mb-16">
              GET STARTED FREE
            </button>

            <div className="grid sm:grid-cols-3 gap-4 w-full max-w-3xl mb-16 text-left">
              <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-5">
                <div className="w-9 h-9 rounded-lg bg-[#2E9DF4]/15 flex items-center justify-center mb-3">
                  <Icon.Upload className="w-4.5 h-4.5 text-[#2E9DF4]" />
                </div>
                <div className="mono text-[12px] text-white mb-1">1. UPLOAD</div>
                <p className="text-[13px] text-[#8CA3C7]">Drop in any PDF from your device.</p>
              </div>
              <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-5">
                <div className="w-9 h-9 rounded-lg bg-[#2E9DF4]/15 flex items-center justify-center mb-3">
                  <Icon.Sparkles className="w-4.5 h-4.5 text-[#2E9DF4]" />
                </div>
                <div className="mono text-[12px] text-white mb-1">2. SUMMARIZE</div>
                <p className="text-[13px] text-[#8CA3C7]">Get the key points in seconds, no fluff.</p>
              </div>
              <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-5">
                <div className="w-9 h-9 rounded-lg bg-[#2E9DF4]/15 flex items-center justify-center mb-3">
                  <Icon.Send className="w-4.5 h-4.5 text-[#2E9DF4]" />
                </div>
                <div className="mono text-[12px] text-white mb-1">3. ASK</div>
                <p className="text-[13px] text-[#8CA3C7]">Chat with the document for anything it missed.</p>
              </div>
            </div>

            <h2 className="mono text-[13px] text-[#8CA3C7] tracking-widest mb-5">PRICING</h2>
            <div className="grid sm:grid-cols-3 gap-4 w-full max-w-3xl text-left">
              <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-5 flex flex-col">
                <div className="mono text-[12px] text-[#8CA3C7] mb-1">FREE</div>
                <div className="text-2xl font-semibold text-white mb-3">GHS 0</div>
                <p className="text-[13px] text-[#8CA3C7] flex-1">1 document a day, up to 4 pages.</p>
              </div>
              <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-5 flex flex-col">
                <div className="mono text-[12px] text-[#8CA3C7] mb-1">24-HOUR PASS</div>
                <div className="text-2xl font-semibold text-white mb-3">GHS 2</div>
                <p className="text-[13px] text-[#8CA3C7] flex-1">Unlimited documents for a full day.</p>
              </div>
              <div className="bg-[#16213A] border border-[#2E9DF4] rounded-xl p-5 flex flex-col relative">
                <div className="absolute -top-2.5 right-4 mono text-[10px] bg-[#2E9DF4] text-[#0B1220] px-2 py-0.5 rounded font-semibold">POPULAR</div>
                <div className="mono text-[12px] text-[#8CA3C7] mb-1">PRO</div>
                <div className="text-2xl font-semibold text-white mb-3">GHS 30<span className="text-sm text-[#8CA3C7] font-normal">/mo</span></div>
                <p className="text-[13px] text-[#8CA3C7] flex-1">Unlimited documents, longer docs, no ads.</p>
              </div>
            </div>
          </main>

          <footer className="border-t border-[#25355A] py-6 text-center">
            <span className="mono text-[11px] text-[#8CA3C7]">Docly v1.0 — built for readers who don't have time to read it all.</span>
          </footer>
        </div>
      );
    }
    return (
      <div className="min-h-screen w-full bg-[#0B1220] text-[#E6EDF3] font-sans flex flex-col items-center justify-center px-5">
        <button onClick={() => setPreAuthView("landing")} className="absolute top-5 left-5 text-[#8CA3C7] hover:text-[#E6EDF3] mono text-[12px]">← BACK</button>
        <div className="w-full max-w-sm flex flex-col gap-4">
          <div className="flex items-center gap-2 justify-center mb-2">
            <DoclyLogo size={36} />
            <span className="mono font-semibold text-lg text-white">docly</span>
          </div>
          <p className="text-center text-[13px] text-[#8CA3C7] mb-1">
            {authMode === "signin" ? "Sign in to summarize documents" : "Create an account to get started"}
          </p>
          <div className="flex bg-[#16213A] border border-[#25355A] rounded-lg p-1">
            <button onClick={() => { setAuthMode("signin"); setAuthError(null); setAuthNotice(null); }} className={`flex-1 mono text-[12px] py-2 rounded-md transition-colors ${authMode === "signin" ? "bg-[#2E9DF4] text-[#0B1220] font-semibold" : "text-[#8CA3C7]"}`}>SIGN IN</button>
            <button onClick={() => { setAuthMode("signup"); setAuthError(null); setAuthNotice(null); }} className={`flex-1 mono text-[12px] py-2 rounded-md transition-colors ${authMode === "signup" ? "bg-[#2E9DF4] text-[#0B1220] font-semibold" : "text-[#8CA3C7]"}`}>SIGN UP</button>
          </div>
          <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="you@email.com" className="bg-[#16213A] border border-[#25355A] rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#2E9DF4]/60 placeholder:text-[#8CA3C7]" />
          <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleAuth()} placeholder="Password (6+ characters)" className="bg-[#16213A] border border-[#25355A] rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#2E9DF4]/60 placeholder:text-[#8CA3C7]" />
          {authError && <div className="text-[13px] text-[#FF5C5C]">{authError}</div>}
          {authNotice && <div className="text-[13px] text-[#2E9DF4]">{authNotice}</div>}
          <button onClick={handleAuth} disabled={authLoading} className="mono text-sm bg-[#2E9DF4] neon-glow text-[#0B1220] rounded-lg py-3 flex items-center justify-center gap-2 font-semibold hover:opacity-90 transition-opacity disabled:opacity-50">
            {authLoading ? <Icon.Loader className="w-4 h-4" /> : <Icon.Mail className="w-4 h-4" />}
            {authMode === "signin" ? "SIGN IN" : "CREATE ACCOUNT"}
          </button>
          <div className="flex items-center gap-3 my-1">
            <div className="h-px flex-1 bg-[#25355A]" /><span className="mono text-[10px] text-[#8CA3C7]">OR</span><div className="h-px flex-1 bg-[#25355A]" />
          </div>
          <button onClick={signInWithGoogle} className="bg-white text-[#1a1a1a] rounded-lg py-3 flex items-center justify-center gap-2 text-sm font-medium hover:opacity-90 transition-opacity">
            <svg width="16" height="16" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.9 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5 12.9 4.5 4 13.4 4 24.5S12.9 44.5 24 44.5 44 35.6 44 24.5c0-1.4-.1-2.7-.4-4z"/>
              <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.2z"/>
              <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.6 35.4 27 36 24 36c-5.4 0-9.9-3.1-11.4-7.5l-6.5 5C9.7 40.1 16.3 44.5 24 44.5z"/>
              <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.3 4.4-4.3 5.9l6.5 5.5C39.7 37.3 44 31.5 44 24.5c0-1.4-.1-2.7-.4-4z"/>
            </svg>
            Continue with Google
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full bg-[#0B1220] text-[#E6EDF3] font-sans flex flex-col">
      <header className="border-b border-[#25355A] px-5 py-4 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <DoclyLogo size={28} />
          <span className="mono font-semibold tracking-tight text-[15px] text-white">docly</span>
        </div>
        <div className="flex items-center gap-3">
          <span className="mono text-[11px] text-[#A9C6EC] hidden sm:inline">
            {isPro ? "PRO" : dayPassActive ? "24H PASS" : `${docsLeftToday} FREE DOC LEFT TODAY`}
          </span>
          {!isPro && !dayPassActive && (
            <button onClick={buyDayPass} disabled={payLoading} className="mono text-[11px] px-3 py-1.5 rounded border border-[#8CA3C7] text-[#8CA3C7] hover:bg-[#8CA3C7]/10 transition-colors disabled:opacity-50">
              GHS 2 / 24H
            </button>
          )}
          <button onClick={togglePro} disabled={payLoading} className={`mono text-[11px] px-3 py-1.5 rounded border transition-colors disabled:opacity-50 ${isPro ? "border-[#FFB020] text-[#FFB020] bg-[#FFB020]/10" : "border-[#2E9DF4] text-[#2E9DF4] hover:bg-[#2E9DF4]/10"}`}>
            {payLoading ? <span className="flex items-center gap-1"><Icon.Loader className="w-3 h-3" /> VERIFYING</span> : isPro ? <span className="flex items-center gap-1"><Icon.Check className="w-3 h-3" /> PRO ACTIVE</span> : "UPGRADE TO PRO"}
          </button>
          <button onClick={openUpdates} className="relative text-[#8CA3C7] hover:text-[#E6EDF3] transition-colors" title="Updates">
            <Icon.Bell className="w-4 h-4" />
            {hasUnseenUpdate && <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-[#FF5C5C]" />}
          </button>
          <button onClick={signOut} className="text-[#8CA3C7] hover:text-[#E6EDF3] transition-colors" title="Sign out"><Icon.Logout className="w-4 h-4" /></button>
        </div>
      </header>

      {payError && (
        <div className="bg-[#FF5C5C]/10 border-b border-[#FF5C5C]/30 text-[#FF5C5C] text-[12px] text-center py-2 px-4">{payError}</div>
      )}

      <main className="flex-1 flex flex-col items-center px-4 py-10">
        {!file ? (
          <div className="w-full max-w-xl flex flex-col items-center text-center mt-10">
            <span className="mono text-[11px] text-[#2E9DF4] neon-text tracking-widest mb-3">DOCUMENT → GIST</span>
            <h1 className="text-3xl sm:text-4xl font-semibold tracking-tight mb-3 text-white">Read the point, skip the pages.</h1>
            <p className="text-[#8CA3C7] mb-8 max-w-md">Drop in a PDF. Get a clean summary in seconds, then ask it anything about the document.</p>
            <div onDragOver={(e) => e.preventDefault()} onDrop={onDrop} className="relative w-full border border-dashed border-[#25355A] rounded-xl py-14 px-6 hover:border-[#2E9DF4]/60 transition-colors flex flex-col items-center gap-3 bg-[#16213A]">
              <Icon.Upload className="w-6 h-6 text-[#2E9DF4]" />
              <div className="mono text-sm text-[#E6EDF3]">Drop a PDF, or tap to choose one</div>
              <div className="text-[11px] text-[#8CA3C7]">Free: {FREE_MAX_PAGES} pages, {FREE_DOCS_PER_DAY} document a day</div>
              <input ref={fileInputRef} type="file" accept="application/pdf" onChange={(e) => handleFile(e.target.files?.[0])} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
            </div>
            {error && error !== "LIMIT_REACHED" && <div className="mt-4 text-[13px] text-[#FF5C5C]">{error}</div>}
          </div>
        ) : (
          <div className="w-full max-w-2xl flex flex-col gap-4">
            <div className="flex items-center justify-between bg-[#16213A] border border-[#25355A] rounded-lg px-4 py-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="relative w-9 h-11 rounded bg-[#0B1220] border border-[#25355A] overflow-hidden shrink-0 flex items-center justify-center">
                  <Icon.File className="w-4.5 h-4.5 text-[#8CA3C7]" />
                  {loading && <div className="scan-line absolute left-0 right-0 h-6 bg-gradient-to-b from-transparent via-[#2E9DF4]/70 to-transparent" />}
                </div>
                <div className="min-w-0">
                  <div className="text-sm truncate">{file.name}</div>
                  <div className="mono text-[11px] text-[#8CA3C7]">{pageEstimate ? `~${pageEstimate} pages` : "size unknown"}</div>
                </div>
              </div>
              <button onClick={resetDoc} className="text-[#8CA3C7] hover:text-[#E6EDF3] shrink-0"><Icon.X className="w-4 h-4" /></button>
            </div>

            {messages.length === 0 && !loading && error !== "LIMIT_REACHED" && (
              <button onClick={startSummary} className="mono text-sm bg-[#2E9DF4] neon-glow text-[#0B1220] rounded-lg py-3 flex items-center justify-center gap-2 font-semibold hover:opacity-90 transition-opacity">
                <Icon.Sparkles className="w-4 h-4" /> SUMMARIZE
              </button>
            )}

            {error === "LIMIT_REACHED" && (
              <div className="border border-[#2E9DF4]/40 bg-[#2E9DF4]/5 rounded-lg p-4 flex flex-col gap-3">
                <div className="flex items-center gap-2 text-[#2E9DF4] mono text-[12px]"><Icon.Zap className="w-3.5 h-3.5" /> DAILY LIMIT REACHED</div>
                <p className="text-[13px] text-[#8CA3C7]">You've used today's free document. Unlock more right now, or come back tomorrow.</p>
                <button onClick={buyDayPass} disabled={payLoading} className="mono text-[13px] w-full bg-[#2E9DF4] text-[#0B1220] rounded-lg py-2.5 font-semibold hover:opacity-90 transition-opacity disabled:opacity-50">GHS 2 FOR 24 HOURS UNLIMITED</button>
                <button onClick={togglePro} className="mono text-[13px] w-full border border-[#2E9DF4] text-[#2E9DF4] rounded-lg py-2.5 hover:bg-[#2E9DF4]/10 transition-colors">OR GO PRO — GHS 30/MONTH</button>
              </div>
            )}

            {error && error !== "LIMIT_REACHED" && <div className="text-[13px] text-[#FF5C5C]">{error}</div>}

            {(messages.length > 0 || loading) && (
              <div ref={scrollRef} className="flex flex-col gap-4 bg-[#16213A] border border-[#25355A] rounded-lg p-4 max-h-[50vh] overflow-y-auto">
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`rounded-lg px-3 py-2 max-w-[85%] text-[14px] whitespace-pre-wrap ${m.role === "user" ? "bg-[#2E9DF4]/10 border border-[#2E9DF4]/30 text-[#E6EDF3]" : "bg-[#0B1220] border border-[#25355A] text-[#E6EDF3]"}`}>
                      {m.display}
                    </div>
                  </div>
                ))}
                {loading && (
                  <div className="flex justify-start">
                    <div className="rounded-lg px-3 py-2 bg-[#0B1220] border border-[#25355A] flex items-center gap-2 text-[13px] text-[#8CA3C7]">
                      <Icon.Loader className="w-3.5 h-3.5" /> thinking…
                    </div>
                  </div>
                )}
              </div>
            )}

            {messages.length > 0 && (
              <div className="flex items-center gap-2">
                <input value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && sendQuestion()} placeholder="Ask something about this document…" disabled={loading} className="flex-1 bg-[#16213A] border border-[#25355A] rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#2E9DF4]/60 placeholder:text-[#8CA3C7] disabled:opacity-50" />
                <button onClick={sendQuestion} disabled={loading || !chatInput.trim()} className="bg-[#2E9DF4] text-[#0B1220] rounded-lg p-2.5 disabled:opacity-40 hover:opacity-90 transition-opacity"><Icon.Send className="w-4 h-4" /></button>
              </div>
            )}

            {!isPro && messages.length > 0 && (
              <div className="mono text-[11px] text-[#8CA3C7] flex items-center gap-1.5 justify-center">
                <Icon.Zap className="w-3 h-3 text-[#FFB020]" /> Pro removes the daily limit
              </div>
            )}
          </div>
        )}
      </main>

      {showUpdates && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4">
          <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-5 w-full max-w-sm max-h-[70vh] flex flex-col gap-3">
            <div className="flex items-center justify-between">
              <span className="mono text-sm font-semibold text-white flex items-center gap-2"><Icon.Bell className="w-4 h-4 text-[#2E9DF4]" /> UPDATES</span>
              <button onClick={() => setShowUpdates(false)} className="text-[#8CA3C7] hover:text-[#E6EDF3]"><Icon.X className="w-4 h-4" /></button>
            </div>
            <div className="flex flex-col gap-3 overflow-y-auto">
              {updates.length === 0 ? (
                <p className="text-[13px] text-[#8CA3C7]">No updates yet.</p>
              ) : (
                updates.map((u) => (
                  <div key={u.id} className="border-b border-[#25355A] pb-3 last:border-0">
                    <p className="text-[13px] text-[#E6EDF3] whitespace-pre-wrap">{u.message}</p>
                    <p className="mono text-[10px] text-[#8CA3C7] mt-1">{new Date(u.created_at).toLocaleDateString()}</p>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {showDowngradeConfirm && (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4">
          <div className="bg-[#16213A] border border-[#25355A] rounded-xl p-6 w-full max-w-sm flex flex-col gap-4">
            <p className="text-sm">Turn off Pro features in Docly? This stops your Pro access here, but doesn't cancel the recurring charge on Paystack's side yet — email us if you need billing stopped.</p>
            <div className="flex gap-2">
              <button onClick={confirmDowngrade} className="flex-1 mono text-[13px] border border-[#FF5C5C] text-[#FF5C5C] rounded-lg py-2.5">TURN OFF PRO</button>
              <button onClick={() => setShowDowngradeConfirm(false)} className="flex-1 mono text-[13px] bg-[#2E9DF4] text-[#0B1220] rounded-lg py-2.5 font-semibold">KEEP PRO</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Docly />);
</script>
</body>
</html>
